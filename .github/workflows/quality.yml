name: Quality

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web app
        env:
          # The public Supabase values are required while Next.js evaluates the
          # SSR/browser clients during prerendering. These placeholders are only
          # used for CI compilation; deployments must provide real values.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key
          NEXT_PUBLIC_TMDB_API_KEY: ci-build-tmdb-key
          NEXT_PUBLIC_SITE_URL: https://kino.example.com
        run: pnpm build:web
